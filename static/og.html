<!doctype html>
<!--
  OG image generator — shipped with the project scaffold.
  project-atlas: https://github.com/doublej/project-atlas

  How to produce the image: `just og` (headless Chrome screenshots this file at
  1200x630 into static/og.png). `just og-check` warns while that file is missing.
  Fonts load from ../node_modules, so render it from the repo, not the deployed site.

  For agents: these four base classes are the contract — .og-canvas, .og-brand,
  .og-title, .og-subtitle. Do not rename or remove them. Do restyle them and the
  :root tokens to the project's real font, colors, sizes and layout, and replace
  the placeholder copy with the real brand line, title and subtitle.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OG image — support-details</title>
		<style>
			@font-face {
				font-family: "Bricolage Grotesque Variable";
				font-weight: 200 800;
				src: url("../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2") format("woff2-variations");
			}

			@font-face {
				font-family: "IBM Plex Mono";
				font-weight: 500;
				src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
			}

			:root {
				--og-bg: #f2efe6;
				--og-fg: #1c1b17;
				--og-muted: #5f5b50;
				--og-accent: #2336c4;
				--og-card: #fbfaf5;
				--og-rule: #d8d1bf;
				--og-font: "Bricolage Grotesque Variable", "Avenir Next", sans-serif;
				--og-mono: "IBM Plex Mono", Menlo, monospace;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #d9d4c6;
			}

			.og-canvas {
				box-sizing: border-box;
				width: 1200px;
				height: 630px;
				padding: 72px;
				display: grid;
				grid-template-columns: 1fr 430px;
				align-items: center;
				gap: 56px;
				background: var(--og-bg);
				color: var(--og-fg);
				font-family: var(--og-font);
			}

			.og-copy {
				display: flex;
				flex-direction: column;
				gap: 24px;
			}

			.og-brand {
				font-family: var(--og-mono);
				font-size: 26px;
				font-weight: 500;
				letter-spacing: 0.04em;
			}

			.og-brand span {
				color: var(--og-accent);
			}

			.og-title {
				margin: 0;
				font-size: 76px;
				font-weight: 700;
				line-height: 1;
				letter-spacing: -0.03em;
			}

			.og-subtitle {
				margin: 0;
				max-width: 22ch;
				font-size: 32px;
				line-height: 1.25;
				color: var(--og-muted);
			}

			.og-ticket {
				position: relative;
				padding: 34px 36px 46px;
				border-radius: 22px;
				background: var(--og-card);
				box-shadow: 0 30px 60px -30px rgb(28 27 23 / 45%);
				transform: rotate(2.5deg);
			}

			.og-ticket::after {
				content: "";
				position: absolute;
				inset: auto 0 -8px;
				height: 16px;
				background: radial-gradient(circle at 10px 8px, var(--og-bg) 7px, transparent 7.5px) 0 0 / 20px 16px repeat-x;
			}

			.og-label {
				font-family: var(--og-mono);
				font-size: 16px;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: var(--og-muted);
			}

			.og-device {
				margin: 4px 0 8px;
				font-size: 64px;
				font-weight: 750;
				letter-spacing: -0.02em;
			}

			.og-row {
				display: flex;
				justify-content: space-between;
				gap: 16px;
				padding: 15px 0;
				border-bottom: 2px dashed var(--og-rule);
				font-size: 24px;
				color: var(--og-muted);
			}

			.og-row b {
				font-family: var(--og-mono);
				font-weight: 500;
				color: var(--og-accent);
			}
		</style>
	</head>
	<body>
		<div class="og-canvas">
			<div class="og-copy">
				<div class="og-brand">support<span>·</span>details</div>
				<h1 class="og-title">Your device details, ready to send.</h1>
				<p class="og-subtitle">One tap to share them with whoever is helping you.</p>
			</div>
			<div class="og-ticket" aria-hidden="true">
				<div class="og-label">At a glance</div>
				<div class="og-device">iPhone</div>
				<div class="og-row"><span>System</span><b>iOS 26.0</b></div>
				<div class="og-row"><span>Browser</span><b>Safari 26.0</b></div>
				<div class="og-row"><span>Screen</span><b>393 × 852 at 3×</b></div>
			</div>
		</div>
	</body>
</html>
