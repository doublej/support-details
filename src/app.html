<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f2efe6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111219" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="The phone, browser and screen details a helpdesk asks for, captured in one tap and shared as a link." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Social preview — generated from static/og.html (`just og`). -->
		<meta property="og:title" content="Device details for support" />
		<meta property="og:description" content="The phone, browser and screen details a helpdesk asks for, captured in one tap and shared as a link." />
		<meta property="og:image" content="https://support-details.jurrejan.com/og.png" />
		<meta property="og:url" content="https://support-details.jurrejan.com/" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
